<svg viewBox="0 0 720 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XG-040G-MD 刷机流程">
  <defs>
    <style>
      .bg { fill: #F7F7F8; }
      .th { fill: #171717; font: 500 14px/20px "SF Pro Text","PingFang SC",system-ui,sans-serif; }
      .ts { fill: #52525B; font: 400 12px/18px "SF Pro Text","PingFang SC",system-ui,sans-serif; }
      .arr { stroke: #0FDC78; stroke-width: 1.5; stroke-linecap: round; fill: none; }
      .leader { stroke: #52525B; stroke-width: .75; stroke-linecap: round; stroke-dasharray: 4 4; fill: none; }
      .bnd { fill: none; stroke: rgba(23,23,23,0.12); stroke-dasharray: 5 4; }
      .neutral { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
      .brand { fill: #E5FFF2; stroke: #0FDC78; }
      .brand-th { fill: #004D26; }
      .accent { fill: #EAFBF8; stroke: #27D2BF; }
      .accent-th { fill: #0F766E; }
      .accent-ts { fill: #27D2BF; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #171717; }
        .th { fill: #E5E5E5; }
        .ts { fill: #A1A1AA; }
        .leader { stroke: #A1A1AA; }
        .bnd { stroke: rgba(229,229,229,0.12); }
        .neutral { fill: #171717; stroke: rgba(229,229,229,0.12); }
        .brand { fill: #004D26; stroke: #32F08C; }
        .brand-th { fill: #E5FFF2; }
        .accent { fill: #123F3C; stroke: #27D2BF; }
        .accent-th { fill: #CCFBF1; }
        .accent-ts { fill: #27D2BF; }
      }
    </style>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0FDC78"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="680"/>

  <!-- 入口 -->
  <g>
    <rect class="neutral" x="130" y="24" width="240" height="44" rx="22"/>
    <text class="th" x="250" y="42" text-anchor="middle">python3 scripts/flash.py</text>
    <text class="ts" x="250" y="59" text-anchor="middle">主菜单 · 按 1→6 顺序执行</text>
  </g>
  <path class="arr" d="M250 68 L250 82" marker-end="url(#ah)"/>

  <!-- 阶段一 -->
  <rect class="bnd" x="40" y="88" width="420" height="270" rx="12"/>
  <text class="ts" x="60" y="112">① 原厂固件阶段（telnet + HTTP:7123）</text>

  <g>
    <rect class="neutral" x="80" y="124" width="340" height="44" rx="8"/>
    <text class="th" x="100" y="142">1. 检查环境</text>
    <text class="ts" x="100" y="159">依赖/固件自检 · 选择本机 HTTP IP</text>
  </g>
  <path class="arr" d="M250 168 L250 178" marker-end="url(#ah)"/>
  <g>
    <rect class="neutral" x="80" y="182" width="340" height="44" rx="8"/>
    <text class="th" x="100" y="200">2. 开启 telnet</text>
    <text class="ts" x="100" y="217">Web 登录自动开启（CMCCAdmin）</text>
  </g>
  <path class="arr" d="M250 226 L250 236" marker-end="url(#ah)"/>
  <g>
    <rect class="neutral" x="80" y="240" width="340" height="44" rx="8"/>
    <text class="th" x="100" y="258">3. 查询 SuPassword</text>
    <text class="ts" x="100" y="275">下载日志包自动提取 → .env</text>
  </g>
  <path class="arr" d="M250 284 L250 294" marker-end="url(#ah)"/>
  <g>
    <rect class="neutral" x="80" y="298" width="340" height="44" rx="8"/>
    <text class="th" x="100" y="316">4. 备份 mtd 分区</text>
    <text class="ts" x="100" y="333">仅 mtd6-bosa（推荐）或全量 → backup/</text>
  </g>

  <!-- 右侧手动操作 -->
  <text class="th" x="580" y="112" text-anchor="middle">你只需动手 3 次</text>

  <g>
    <rect class="neutral" x="490" y="124" width="180" height="40" rx="8"/>
    <text class="th" x="506" y="141">① 网卡设多 IP</text>
    <text class="ts" x="506" y="157">net-help 查命令</text>
  </g>
  <path class="leader" d="M490 144 L460 144"/>

  <g>
    <rect class="brand" x="490" y="172" width="180" height="40" rx="8"/>
    <text class="th brand-th" x="506" y="189">② Web 超管密码</text>
    <text class="ts brand-th" x="506" y="205">aDm8H%MdA 固定，回车即可</text>
  </g>
  <path class="leader" d="M490 192 L460 192"/>

  <g>
    <rect class="accent" x="490" y="220" width="180" height="40" rx="8"/>
    <text class="th accent-th" x="506" y="237">③ telnet 贴纸密码</text>
    <text class="ts accent-ts" x="506" y="253">useradmin · 会话只输一次</text>
  </g>
  <path class="leader" d="M490 240 L460 240"/>

  <!-- 阶段一 → 阶段二 -->
  <path class="arr" d="M250 358 L250 372" marker-end="url(#ah)"/>

  <!-- 阶段二 -->
  <rect class="bnd" x="40" y="378" width="420" height="92" rx="12"/>
  <text class="ts" x="60" y="402">② 刷引导（全自动）</text>
  <g>
    <rect class="neutral" x="80" y="414" width="340" height="44" rx="8"/>
    <text class="th" x="100" y="432">5. 刷引导</text>
    <text class="ts" x="100" y="449">run-stock2ubi 起 :3333 → 刷 bl2+fip → 重启探测 192.168.0.1</text>
  </g>

  <path class="arr" d="M250 470 L250 484" marker-end="url(#ah)"/>

  <!-- 阶段三 -->
  <rect class="bnd" x="40" y="490" width="420" height="92" rx="12"/>
  <text class="ts" x="60" y="514">③ U-Boot 阶段 · 192.168.0.1（子菜单可重复）</text>
  <g>
    <rect class="neutral" x="80" y="526" width="340" height="44" rx="8"/>
    <text class="th" x="100" y="544">6. U-Boot 恢复页刷机</text>
    <text class="ts" x="100" y="561">bl2→重建UBI→bosa→u-boot→itb · 失败原地重试</text>
  </g>

  <path class="arr" d="M250 582 L250 596" marker-end="url(#ah)"/>

  <!-- 终点 -->
  <g>
    <rect class="brand" x="150" y="600" width="200" height="44" rx="22"/>
    <text class="th brand-th" x="250" y="627" text-anchor="middle">PonWrt @ 192.168.1.1</text>
  </g>
</svg>
